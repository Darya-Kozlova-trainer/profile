  .app { height: 100vh; display: flex; justify-content: center; }
  .panel {
    width: 100%; max-width: 760px; height: 100vh;
    background: rgba(255, 255, 255, 0.95);
    box-shadow: 0 0 40px rgba(0, 40, 90, 0.15);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .topbar { padding: 18px 28px 0; flex: 0 0 auto; }
  .progress { height: 6px; background: #e3e9f2; border-radius: 3px; overflow: hidden; }
  .progress__fill { height: 100%; background: #1f6fd6; transition: width .4s ease; }
  .steplabel { font-size: 13px; color: #5a6b82; margin-top: 8px; letter-spacing: .3px; }
  .content {
    flex: 1 1 auto; overflow-y: auto; padding: 24px 28px 32px;
    display: flex; flex-direction: column;
  }
  h1 { font-size: 26px; line-height: 1.25; margin-bottom: 14px; color: #0c2f5e; }
  h2 { font-size: 21px; line-height: 1.3; margin-bottom: 8px; color: #0c2f5e; }
  h3.step-title { font-size: 16px; margin: 18px 0 8px; color: #0c2f5e; }
  p { font-size: 16px; line-height: 1.55; margin-bottom: 12px; }
  .muted { color: #5a6b82; font-size: 14px; }
  .task { font-weight: 600; margin: 6px 0 14px; }
  .btn {
    display: inline-block; border: none; border-radius: 10px; padding: 13px 24px;
    font-size: 16px; font-weight: 600; cursor: pointer; background: #1f6fd6; color: #fff;
    text-decoration: none; text-align: center; transition: background .2s, opacity .2s;
  }
  .btn:hover { background: #185bb3; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn--ghost { background: #e8eef7; color: #0c2f5e; }
  .btn--ghost:hover { background: #d9e4f3; }
  .btn-row { margin-top: auto; padding-top: 20px; display: flex; gap: 12px; flex-wrap: wrap; }
  .intro-wrap { margin: auto 0; }

  .profile-wrap { position: relative; width: 100%; max-width: 400px; margin: 0 auto 14px; }
  .profile-wrap img { width: 100%; display: block; border-radius: 14px; border: 1px solid #dfe5ee; }
  .zone {
    position: absolute; cursor: pointer; border-radius: 10px;
    border: 2px dashed transparent; transition: background .2s, border-color .2s;
  }
  .zone:hover { border-color: #1f6fd6; background: rgba(31, 111, 214, 0.08); }
  .zone.selected { border: 2px solid #1f6fd6; background: rgba(31, 111, 214, 0.18); }
  .counter { font-size: 15px; font-weight: 600; margin-bottom: 10px; color: #0c2f5e; }

  .feedback { border-radius: 10px; padding: 12px 14px; margin: 10px 0; font-size: 15px; line-height: 1.5; }
  .feedback--ok { background: #e8f6ee; border-left: 4px solid #2e9e5b; }
  .feedback--neutral { background: #fff6e0; border-left: 4px solid #d99a14; }
  .feedback strong { display: block; margin-bottom: 4px; }

  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 8px; }
  .option {
    text-align: left; border: 1.5px solid #d6dfeb; background: #fff; border-radius: 12px;
    padding: 14px 16px; font-size: 15px; line-height: 1.5; cursor: pointer; color: #1d2633;
    transition: border-color .2s, background .2s; font-family: inherit;
  }
  .option:hover { border-color: #1f6fd6; }
  .option.selected-ok { border-color: #2e9e5b; background: #e8f6ee; }
  .option.selected-bad { border-color: #d9534f; background: #fdecea; }
  .option:disabled { cursor: default; }
  .option--uniform { min-height: 104px; display: flex; align-items: flex-start; }

  .step-block { border-bottom: 1px solid #e6ecf4; padding-bottom: 6px; }
  .step-block:last-of-type { border-bottom: none; }

  .chat { background: #eef3fa; border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px; margin: 4px 0 14px; }
  .bubble { max-width: 88%; padding: 10px 14px; border-radius: 14px; font-size: 15px; line-height: 1.45; }
  .bubble--in { background: #fff; align-self: flex-start; border-bottom-left-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .bubble--out { background: #1f6fd6; color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
  .bubble--client { background: #fff3e6; align-self: flex-start; border-bottom-left-radius: 4px; }

      ${ZONES.map(z => `<div class="zone" data-item="${z.item}" style="left:${z.left}%;top:${z.top}%;width:${z.width}%;height:${z.height}%"></div>`).join("")}
    </div>
    <div id="r1Feedback"></div>
    <div class="btn-row" id="r1Buttons">
      <button class="btn" id="checkBtn" disabled>Проверить</button>
    </div>
  `);

  document.querySelectorAll(".zone").forEach(el => {
    el.onclick = () => {
      if (state.r1Checked) return;
      const item = el.dataset.item;
      if (state.r1.has(item)) state.r1.delete(item);
      else if (state.r1.size < 5) state.r1.add(item);
      else {
        document.getElementById("counter").textContent = "Уже выбрано 5. Чтобы выбрать другой элемент, снимите лишний — нажмите на него еще раз.";
        return;
      }
      updateR1Selection();
    };
  });
  document.getElementById("checkBtn").onclick = checkR1;
}

function updateR1Selection() {
  document.querySelectorAll(".zone").forEach(el => {
    el.classList.toggle("selected", state.r1.has(el.dataset.item));
  });
  document.getElementById("counter").textContent = "Выбрано: " + state.r1.size + " из 5";
  document.getElementById("checkBtn").disabled = state.r1.size !== 5;
}

function checkR1() {
  state.r1Checked = true;
  const correctCount = [...state.r1].filter(i => R1_CORRECT.includes(i)).length;
  const allOk = correctCount === 5;
  let html = "";
  R1_ORDER.filter(i => state.r1.has(i)).forEach(i => {
    const item = R1_ITEMS[i];
    const isBarrier = R1_CORRECT.includes(i);
    html += `<div class="feedback ${isBarrier ? "feedback--ok" : "feedback--neutral"}">
      <strong>${item.title}</strong>${item.text}</div>`;
  });
  html += `<p class="muted">Верно выбрано барьеров: ${correctCount} из 5.</p>`;
  document.getElementById("r1Feedback").innerHTML = html;
  document.querySelectorAll(".zone").forEach(el => el.style.pointerEvents = "none");
  document.getElementById("counter").textContent = allOk ? "Все 5 барьеров найдены" : "Верно: " + correctCount + " из 5";
  document.getElementById("r1Buttons").innerHTML = allOk
    ? `<button class="btn" id="nextBtn">Далее</button>`
    : `<button class="btn btn--ghost" id="retryBtn">Попробовать снова</button><button class="btn" id="nextBtn">Далее</button>`;
  document.getElementById("nextBtn").onclick = screenRound2;
  const retry = document.getElementById("retryBtn");
  if (retry) retry.onclick = screenRound1;
}

function screenRound2() {
  setProgress(2, "Раунд 2 из 3. Описание «О себе»");
  state.r2 = [null, null, null];
  renderR2(false);
}

function renderR2(keepScroll) {
  const allOk = state.r2.every((c, i) => c !== null && R2_STEPS[i].options[c].ok);
  const blocks = R2_STEPS.map((s, si) => {
    const chosen = state.r2[si];
    const opts = s.options.map((o, oi) => {
      let cls = "option";
      if (chosen === oi) cls += o.ok ? " selected-ok" : " selected-bad";
      return `<button class="${cls}" data-s="${si}" data-o="${oi}">${o.text}</button>`;
    }).join("");
    const fb = chosen === null ? "" : `<div class="feedback ${s.options[chosen].ok ? "feedback--ok" : "feedback--neutral"}">
        <strong>${s.options[chosen].ok ? "Верно" : "Подумайте еще"}</strong>${s.options[chosen].comment}</div>`;
    return `<div class="step-block"><h3 class="step-title">${s.title}</h3><div class="options">${opts}</div>${fb}</div>`;
  }).join("");

  render(`
    <h2>Раунд 2. «Собери идеальное описание "О себе"»</h2>
    <p class="task">Помогите агенту Игорю переписать статус так, чтобы клиент за 5 секунд понял: кто он, чем поможет и как связаться. Выберите по 1 лучшему варианту на каждом шаге.</p>
    ${blocks}
    <div id="r2Result"></div>
    <div class="btn-row"><button class="btn" id="r2Done" ${allOk ? "" : "disabled"}>Собрать описание</button></div>
  `, keepScroll);

  document.querySelectorAll(".option").forEach(btn => {
    btn.onclick = () => {
      const si = Number(btn.dataset.s), oi = Number(btn.dataset.o);
      if (state.r2[si] !== null && R2_STEPS[si].options[state.r2[si]].ok) return;
      state.r2[si] = oi;
      renderR2(true);
    };
  });

  const done = document.getElementById("r2Done");
  done.onclick = () => {
    const box = document.getElementById("r2Result");
    box.innerHTML = `<div class="preview">${R2_RESULT.map(t => `<p style="margin-bottom:8px">${t}</p>`).join("")}</div>
      <p class="muted">Клиент за 5 секунд видит: кто вы, чем поможете и какое действие сделать.</p>`;
    done.outerHTML = `<button class="btn" id="toR3">Перейти к раунду 3</button>`;
    document.getElementById("toR3").onclick = screenRound3;
    box.scrollIntoView({ behavior: "smooth", block: "center" });
  };
}

function screenRound3() {
  setProgress(3, "Раунд 3 из 3. Первый диалог");
  state.r3Chosen = null;
  renderR3(false);
}

function renderR3(keepScroll) {
  const chosen = state.r3Chosen;
  const chat = `
    <div class="chat">
      <div class="bubble-label">Новый клиент</div>
      <div class="bubble bubble--in">${R3.incoming}</div>
      ${chosen !== null ? `
        <div class="bubble-label" style="align-self:flex-end">Ваш ответ</div>
        <div class="bubble bubble--out">${R3.options[chosen].text}</div>
        <div class="bubble-label">Реакция клиента</div>
        <div class="bubble bubble--client">${R3.options[chosen].reaction}</div>` : ""}
    </div>`;
  const review = chosen !== null ? `
    <div class="feedback ${R3.options[chosen].ok ? "feedback--ok" : "feedback--neutral"}">
      <strong>Разбор</strong>${R3.options[chosen].review}</div>` : "";
  const buttons = chosen === null ? "" : (R3.options[chosen].ok
      ? `<button class="btn" id="toFinish">Далее</button>`
      : `<button class="btn btn--ghost" id="retryR3">Выбрать другой ответ</button>`);

  render(`
    <h2>Раунд 3. «Первый диалог»</h2>
    <p class="task">Профиль настроен. Вам приходит сообщение от нового клиента.</p>
    ${chat}
    ${review}
    ${chosen === null ? `<div class="options">
      ${R3.options.map((o, i) => `<button class="option option--uniform" data-i="${i}">${o.text}</button>`).join("")}
    </div>` : ""}
    <div class="btn-row">${buttons}</div>
  `, keepScroll);

  document.querySelectorAll(".options .option").forEach(btn => {
    btn.onclick = () => {
      state.r3Chosen = Number(btn.dataset.i);
      renderR3(true);
    };
  });
  const toFinish = document.getElementById("toFinish");
  if (toFinish) toFinish.onclick = screenFinal;
  const retry = document.getElementById("retryR3");
  if (retry) retry.onclick = () => { state.r3Chosen = null; renderR3(true); };
}

function screenFinal() {
  setProgress(5, "Финал");
  render(`
    <div class="final-wrap">
      <div class="finish-box">
        <h1>Отличная работа! Вы прошли проверку глазами клиента.</h1>
        <p>Теперь откройте свой рабочий мессенджер или социальную сеть и внесите одно улучшение прямо сейчас (это займет не больше 3 минут).</p>
      </div>
      <div class="final-buttons">
        <button class="btn btn--ghost" id="restart">Пройти заново</button>
        <a class="btn" href="${REG_URL}" target="_blank" rel="noopener">Регистрация</a>
      </div>
      <small class="final-note">Регистрация необходима для начисления баллов. Укажите ФИО и название АЦ/УО_Филиал.</small>
    </div>
  `);
  document.getElementById("restart").onclick = screenIntro;
}

screenIntro();
</script>
